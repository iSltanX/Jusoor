# إعدادات pnpm. اعتبارًا من pnpm 11 لم تعد تُقرأ من package.json.

# لا يُسمح لأي تبعية بتشغيل سكربت تثبيت.
# سكربتات التثبيت تنفّذ كودًا عند كل install، وجُسور لا يحتاج أيًّا منها:
#   esbuild    — ثنائي المنصة يصل جاهزًا عبر optionalDependencies (@esbuild/<platform>).
#   spawn-sync — توافقية لإصدارات Node قديمة.
# أي تبعية تحتاج سكربت بناء مستقبلًا تُضاف هنا صراحةً بعد مراجعة.
onlyBuiltDependencies: []

# pnpm 11.11 يعدّ أي سكربت تثبيت لم يُحسم أمره خطأً يُفشل `pnpm install`
# (ERR_PNPM_IGNORED_BUILDS)، فيُسجَّل الرفض هنا صراحةً. القيمة false تعني: لا يُشغَّل.
allowBuilds:
  esbuild: false
  spawn-sync: false
